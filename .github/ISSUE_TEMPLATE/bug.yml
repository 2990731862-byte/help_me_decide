name: 发现一个 bug
description: 行为和预期不一致
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        填完记得在右侧挂 **Milestone**。

  - type: textarea
    id: repro
    attributes:
      label: 怎么复现
      description: 一步一步写，包括点了什么、填了什么。
      placeholder: |
        1. 建房，昵称 A，密码 0826
        2. 另一个浏览器加入，昵称 B
        3. A 提交申请，金额填 0
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期是什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际是什么
      description: 报错原文、接口返回的 status 和 body、控制台输出，有多少贴多少。
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      description: 操作系统 + `node -v` 的输出 + 浏览器
      placeholder: "Windows 11 / node v24.5.0 / Chrome 129"
    validations:
      required: true

  - type: checkboxes
    id: checked
    attributes:
      label: 动手前查过
      options:
        - label: 跑过 `npm test`，并写清是全绿还是哪条红了
          required: true
        - label: 搜过现有 Issue，没有重复
          required: true
